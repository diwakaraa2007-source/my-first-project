    <div class="submit-area">

        <button id="submitBtn" onclick="submitAttendance()">
            SUBMIT ATTENDANCE
        </button>

    </div>

    <button id="undoBtn" onclick="undoLast()">
        ↶ Undo
    </button>

    <div id="message"></div>


    <script>

        // Store attendance here
        let attendance = {};

        // Store previous action for Undo
        let lastAction = null;


        // Mark Present / Absent
        function markAttendance(studentId, status, button) {

            let oldStatus = attendance[studentId] || null;

            attendance[studentId] = status;

            lastAction = {
                studentId: studentId,
                oldStatus: oldStatus
            };

            // Remove selection from both buttons in this row
            let row = button.parentElement;

            let buttons = row.querySelectorAll("button");

            buttons.forEach(function (btn) {
                btn.classList.remove("selected");
            });

            // Highlight selected button
            button.classList.add("selected");
        }


        // Undo last attendance selection
        function undoLast() {

            if (lastAction === null) {
                alert("Nothing to undo.");
                return;
            }

            if (lastAction.oldStatus === null) {
                delete attendance[lastAction.studentId];
            } else {
                attendance[lastAction.studentId] = lastAction.oldStatus;
            }

            location.reload();
        }


        // Submit attendance
        async function submitAttendance() {

            // Check that all 5 students have been marked
            if (Object.keys(attendance).length !== 5) {

                alert("Please mark attendance for all students first.");

                return;
            }


            // Create records for Flask
            let records = [];

            for (let studentId = 1; studentId <= 5; studentId++) {

                records.push({
                    student_id: studentId,
                    status: attendance[studentId]
                });

            }


            // Disable button while submitting
            let submitButton = document.getElementById("submitBtn");

            submitButton.disabled = true;

            submitButton.innerText = "Submitting...";


            try {

                let response = await fetch("/submit-attendance", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        records: records
                    })

                });


                let result = await response.json();


                if (response.ok && result.success) {

                    document.getElementById("message").innerText =
                        "Attendance submitted and locked successfully.";
